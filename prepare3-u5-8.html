                        <div>
                            <h3 class="text-xl font-bold text-slate-800 mb-2">Comparative and Superlative Adverbs</h3>
                            <p class="text-slate-600 mb-2">We use <strong>adjectives</strong> to describe a noun and <strong>adverbs</strong> to describe a verb.</p>
                            <ul class="list-disc list-inside space-y-2 text-slate-700">
                                <li>We form most adverbs by adding <strong>-ly</strong> to the adjective. (<em>bad &rarr; badly, careful &rarr; carefully</em>)</li>
                                <li>Some adverbs do not end in -ly. (<em>good &rarr; well, fast &rarr; fast, hard &rarr; hard, late &rarr; late</em>)</li>
                            </ul>
                        </div>
                        <div>
                            <h4 class="text-lg font-semibold text-slate-700 mb-2">Comparatives</h4>
                            <p class="text-slate-600 mb-2">We use comparative adverbs to compare two things.</p>
                            <ul class="list-disc list-inside space-y-2 text-slate-700">
                                <li>We use <strong>more</strong> with adverbs that finish in -ly. (<em>more quickly, more carefully</em>)</li>
                                <li>The opposite of more is <strong>less</strong>. (<em>less carefully</em>)</li>
                                <li>We add <strong>-er</strong> to fast, hard, and late. (<em>faster, harder, later</em>)</li>
                                <li>Irregular: well &rarr; <strong>better</strong>, badly &rarr; <strong>worse</strong>.</li>
                                <li>We can use <strong>(not) as + adverb + as</strong> to compare things. (<em>Jane doesn't write as quickly as Paula.</em>)</li>
                            </ul>
                        </div>
                        <div>
                            <h4 class="text-lg font-semibold text-slate-700 mb-2">Superlatives</h4>
                            <p class="text-slate-600 mb-2">We use superlative adverbs to compare one thing with two or more other things.</p>
                            <ul class="list-disc list-inside space-y-2 text-slate-700">

                                <li>We add <strong>-est</strong> to fast, hard, and late. (<em>the fastest, the hardest, the latest</em>)</li>

                            <ul class="list-disc list-inside space-y-2 text-slate-700">
                                <li>We use 's for people and animals. (<em>That's my brother's hat.</em>)</li>
                                <li>With singular nouns, we use 's. (<em>my mum's necklace, my teacher's ring</em>)</li>
                                <li>With plural nouns ending in -s, we put the apostrophe (') at the end. (<em>my friends' shoes, my cousins' jackets</em>)</li>

                            <table class="w-full text-left border-collapse mt-2 mb-4">

                            <ul class="list-disc list-inside space-y-2 text-slate-700">
                                <li>We use <strong>will</strong> to talk about things which we think are certain to happen in the future.<br><em class="text-slate-500">Everyone <strong>will live</strong> in big cities in the future.</em><br><em class="text-slate-500">We <strong>won't live</strong> in small towns.</em></li>
                                <li>We often use expressions like <em>I think, I hope, I'm sure</em> or <em>certain</em> with will.<br><em class="text-slate-500"><strong>I think</strong> I'<strong>ll work</strong> in a big bank.</em><br><em class="text-slate-500"><strong>I'm sure</strong> my friends <strong>won't live</strong> in the same town.</em></li>

                                    <tr><td class="p-2 border border-slate-200 font-bold bg-slate-50">Questions</td><td class="p-2 border border-slate-200"><strong>Will</strong> I / you / he / she / it / we / they <strong>drive</strong> cars?</td></tr>

                        <div class="mt-8">

                                <li>When we talk about future possibilities, <em>may</em> and <em>might</em> have the same meaning.<br><em class="text-slate-500">I <strong>may / might buy</strong> some new trainers tomorrow.</em></li>
                                <li>We don't often use <em>may</em> or <em>might</em> to ask questions about future possibilities. We usually use <strong>will</strong>.<br><em class="text-slate-500">What <strong>will</strong> you take on the school trip? (<strong>NOT</strong> What may you take...)</em></li>

                                <table class="w-full text-left border-collapse text-sm">
                                    <tr><td class="p-2 border border-slate-200 font-bold bg-slate-50">Positive</td><td class="p-2 border border-slate-200">I / You / He / She / It / We / They <strong>may / might book</strong> the hotel today.</td></tr>
                                    <tr><td class="p-2 border border-slate-200 font-bold bg-slate-50">Negative</td><td class="p-2 border border-slate-200">I / You / He / She / It / We / They <strong>may not / might not ring</strong> you later.</td></tr>
                                </table>
                            </div>
                        </div>
                    </div>
                `,
                activity: [
                    { q: "I'm sure we ___ flying cars in the future.", o: ["will have", "might have"], a: 0 },
                    { q: "It's very cloudy. It ___ rain this afternoon.", o: ["will", "might"], a: 1 },
                    { q: "I haven't decided yet, but I ___ go to the party.", o: ["will", "may"], a: 1 },
                    { q: "Don't worry, I ___ help you with your homework.", o: ["will", "might"], a: 0 },
                    { q: "We ___ not go to the beach tomorrow if it's cold.", o: ["won't", "might"], a: 1 },
                    { q: "I think people ___ live on Mars one day.", o: ["might", "will"], a: 1 },
                    { q: "___ you go to university when you finish school?", o: ["Will", "May"], a: 0 },
                    { q: "She ___ come with us, but she's not sure yet.", o: ["won't", "may"], a: 1 },
                    { q: "I promise I ___ tell anyone your secret.", o: ["might not", "won't"], a: 1 },
                    { q: "Take an umbrella. It ___ rain later.", o: ["will", "might"], a: 1 }
                ]
            }
        };

        // --- SOUND SETUP ---
        let soundsReady = false;
        const clickSound = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.005, decay: 0.1, sustain: 0.0, release: 0.1 } }).toDestination();
        const correctSound = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.005, decay: 0.2, sustain: 0.0, release: 0.2 } }).toDestination();
        const incorrectSound = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.3 } }).toDestination();

        async function initAudio() { if (!soundsReady) { try { await Tone.start(); soundsReady = true; } catch (e) { console.error("Audio context failed", e); } } }
        function playSound(sound, note = "C4") { if (soundsReady) sound.triggerAttackRelease(note, "8n", Tone.now()); }
        
        // --- SCREEN MANAGEMENT ---
        const screens = document.querySelectorAll('.screen');
        const unitScreen = document.getElementById('unit-screen');
        const contentScreen = document.getElementById('content-screen');

        function showScreen(screenId) {
            screens.forEach(screen => screen.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
        }

        function goHome() { playSound(clickSound); showScreen('home-screen'); }

        // --- NAVIGATION & DISPLAY LOGIC ---

        function displayUnit(unitNumber) {
            initAudio();
            playSound(clickSound);
            unitScreen.innerHTML = `
                <header class="text-center mb-8"><h1 class="text-3xl md:text-4xl font-bold text-slate-900">Unit ${unitNumber}</h1><p class="text-slate-600 mt-2">Select a section to review.</p></header>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-xl mx-auto">
                    <button onclick="displayVocabCategories(${unitNumber})" class="bg-white hover:bg-slate-100 text-slate-700 font-semibold py-8 px-4 border border-slate-200 rounded-lg shadow-sm transition-all duration-200 text-xl">Vocabulary</button>
                    <button onclick="displayGrammarMenu(${unitNumber})" class="bg-white hover:bg-slate-100 text-slate-700 font-semibold py-8 px-4 border border-slate-200 rounded-lg shadow-sm transition-all duration-200 text-xl">Grammar</button>
                </div>
                <div class="text-center mt-8"><button onclick="goHome()" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2 px-6 rounded-lg transition">&larr; Back to Home</button></div>`;
            showScreen('unit-screen');
        }

        function displayVocabCategories(unitNumber) {
            playSound(clickSound);
            const categories = Object.keys(vocabData[unitNumber]);
            contentScreen.innerHTML = `
                <header class="text-center mb-8"><h1 class="text-2xl md:text-3xl font-bold text-slate-900">Unit ${unitNumber} Vocabulary</h1><p class="text-slate-600 mt-2">Select a category.</p></header>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl mx-auto">
                    ${categories.map(category => `<button onclick="displayVocabActivity(${unitNumber}, '${category}')" class="bg-white hover:bg-slate-100 text-slate-700 font-semibold py-6 px-4 border border-slate-200 rounded-lg shadow-sm transition-all duration-200 text-lg">${category}</button>`).join('')}
                </div>
                <div class="text-center mt-8"><button onclick="displayUnit(${unitNumber})" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2 px-6 rounded-lg transition">&larr; Back to Unit ${unitNumber} Menu</button></div>`;
            showScreen('content-screen');
        }
        
        function displayGrammarMenu(unitNumber) {
            playSound(clickSound);
            contentScreen.innerHTML = `
                <header class="text-center mb-8"><h1 class="text-2xl md:text-3xl font-bold text-slate-900">Unit ${unitNumber} Grammar</h1><p class="text-slate-600 mt-2">Select a section.</p></header>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-xl mx-auto">
                    <button onclick="displayGrammarTheory(${unitNumber})" class="bg-white hover:bg-slate-100 text-slate-700 font-semibold py-8 px-4 border border-slate-200 rounded-lg shadow-sm transition-all duration-200 text-xl">Theory</button>
                    <button onclick="displayGrammarActivity(${unitNumber})" class="bg-white hover:bg-slate-100 text-slate-700 font-semibold py-8 px-4 border border-slate-200 rounded-lg shadow-sm transition-all duration-200 text-xl">Activity</button>
                </div>
                <div class="text-center mt-8"><button onclick="displayUnit(${unitNumber})" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2 px-6 rounded-lg transition">&larr; Back to Unit ${unitNumber} Menu</button></div>`;
            showScreen('content-screen');
        }

        // --- Drag and Drop Logic ---
        window.drag = function(ev) {
            ev.dataTransfer.setData("text/plain", ev.target.dataset.word);
            ev.dataTransfer.setData("elementId", ev.target.id);
        };
        
        window.allowDrop = function(ev) {
            ev.preventDefault();
            let target = ev.target;
            if (target.tagName === 'SPAN') target = target.parentElement;
            if (!target.classList.contains('dropped')) {
                target.classList.add('bg-sky-100', 'border-sky-400');
            }
        };
        
        window.dragLeave = function(ev) {
            let target = ev.target;
            if (target.tagName === 'SPAN') target = target.parentElement;
            target.classList.remove('bg-sky-100', 'border-sky-400');
        };
        
        window.drop = function(ev, correctWord, uniqueId) {
            ev.preventDefault();
            let dropTarget = ev.target;
            if (dropTarget.tagName === 'SPAN') dropTarget = dropTarget.parentElement;
            
            dropTarget.classList.remove('bg-sky-100', 'border-sky-400');
            
            const draggedWord = ev.dataTransfer.getData("text/plain");
            const elementId = ev.dataTransfer.getData("elementId");

            if (!draggedWord) return;

            if (draggedWord.toLowerCase() === correctWord.toLowerCase()) {
                playSound(correctSound, "C5");
                dropTarget.classList.add('dropped'); 
                dropTarget.innerHTML = `<span class="font-bold text-green-700">${draggedWord}</span>`;
                dropTarget.classList.replace('border-slate-300', 'border-green-500');
                dropTarget.classList.replace('border-dashed', 'border-solid');
                dropTarget.classList.replace('bg-slate-50', 'bg-green-50');
                dropTarget.removeAttribute('ondrop');
                dropTarget.removeAttribute('ondragover');
                
                document.getElementById(elementId).style.visibility = 'hidden';
            } else {
                playSound(incorrectSound, "C3");
                const originalHTML = dropTarget.innerHTML;
                dropTarget.innerHTML = `<span class="text-red-500 text-sm font-bold">Try again</span>`;
                dropTarget.classList.replace('border-slate-300', 'border-red-400');
                dropTarget.classList.replace('bg-slate-50', 'bg-red-50');
                setTimeout(() => {
                    if (!dropTarget.classList.contains('dropped')) {
                        dropTarget.innerHTML = originalHTML;
                        dropTarget.classList.replace('border-red-400', 'border-slate-300');
                        dropTarget.classList.replace('bg-red-50', 'bg-slate-50');
                    }
                }, 1000);
            }
        };

        function displayVocabActivity(unitNumber, categoryName) {
            playSound(clickSound);
            const words = vocabData[unitNumber][categoryName];
            
            if (unitNumber === 8 && categoryName === "Furniture and Household Appliances") {
                contentScreen.innerHTML = `
                    <header class="text-center mb-8">
                        <h1 class="text-2xl md:text-3xl font-bold text-slate-900">${categoryName}</h1>
                        <p class="text-slate-600 mt-2">Open the mystery box, read the IPA, type the word, and say its use aloud before flipping!</p>
                    </header>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        ${words.map((item, index) => {
                            const uniqueId = `u${unitNumber}-c${categoryName.replace(/\s/g, '')}-${index}`;
                            return `
                                <div class="w-full h-64 perspective-1000 relative">
                                    <!-- Mystery Box Overlay -->
                                    <div id="mystery-box-${uniqueId}" class="absolute inset-0 bg-indigo-500 text-white flex flex-col items-center justify-center rounded-xl cursor-pointer hover:bg-indigo-600 transition-all duration-300 shadow-md z-10" onclick="openMysteryBox('${uniqueId}')">
                                        <span class="text-5xl mb-3">🎁</span>
                                        <span class="font-bold text-lg">Open Box</span>
                                    </div>

                                    <!-- The Flip Card Container -->
                                    <div id="flip-card-${uniqueId}" class="w-full h-full relative transition-transform duration-700 transform-style-3d opacity-0 pointer-events-none">
                                        
                                        <!-- FRONT: IPA and Input -->
                                        <div class="absolute inset-0 backface-hidden bg-white border border-slate-200 rounded-xl shadow-sm p-4 flex flex-col justify-between z-10">
                                            <div class="text-center mt-2">
                                                <p class="text-xs text-slate-500 font-semibold tracking-wider uppercase mb-1">Pronunciation</p>
                                                <p class="text-xl font-mono font-bold text-sky-600">${item.ipa}</p>
                                            </div>
                                            <div class="flex flex-col gap-2 mt-4">
                                                <input type="text" id="input-${uniqueId}" data-answer="${item.word.toLowerCase()}" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-500 transition text-center" placeholder="Type word here...">
                                                <p class="text-[10px] text-slate-400 text-center uppercase tracking-wide">Say what it's used for aloud!</p>
                                                <button onclick="checkAndFlip('${uniqueId}')" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2 px-4 rounded-md transition mt-1">Turn Over</button>
                                            </div>
                                        </div>

                                        <!-- BACK: Word and Usage -->
                                        <div class="absolute inset-0 backface-hidden rotate-y-180 bg-slate-50 border border-slate-200 rounded-xl shadow-sm p-4 flex flex-col justify-center items-center text-center">
                                            <p id="result-msg-${uniqueId}" class="text-lg font-bold mb-2"></p>
                                            <p class="text-2xl font-bold text-slate-800 mb-3 text-sky-700 capitalize">${item.word}</p>
                                            <div class="bg-white p-3 rounded border border-slate-200 w-full overflow-y-auto">
                                                <p class="text-xs text-slate-400 uppercase font-semibold mb-1">Usage / Meaning</p>
                                                <p class="text-sm text-slate-600 italic">"${item.hint}"</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    
                    <div class="text-center mt-10">
                        <button onclick="displayVocabCategories(${unitNumber})" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2 px-6 rounded-lg transition">&larr; Back to Vocabulary Categories</button>
                    </div>
                `;
                showScreen('content-screen');
                
                // Add enter key listener for the flip cards
                contentScreen.querySelectorAll('input[type="text"]').forEach(input => {
                    input.addEventListener('keypress', e => e.key === 'Enter' && checkAndFlip(input.id.replace('input-', '')));
                });
                return;
            }

            // Special layout for Drag and Drop (Unit 6: Adjectives)
            if (categoryName === "Adjectives for Describing Objects") {
                const shuffledWords = [...words].sort(() => 0.5 - Math.random());
                
                contentScreen.innerHTML = `
                    <header class="text-center mb-8">
                        <h1 class="text-2xl md:text-3xl font-bold text-slate-900">${categoryName}</h1>
                        <p class="text-slate-600 mt-2">Drag the correct word to match the description.</p>
                    </header>
                    
                    <div class="flex flex-col md:flex-row gap-6 items-start max-w-5xl mx-auto">
                        <!-- Left: Word Bank (Sticky/Locked) -->
                        <div class="w-full md:w-1/3 sticky top-4 bg-slate-100 p-4 rounded-xl shadow-inner border border-slate-200">
                            <h3 class="font-bold mb-3 text-slate-700 text-center">Word Bank</h3>
                            <div id="word-bank" class="flex flex-wrap gap-2 justify-center">
                                ${shuffledWords.map((item, idx) => `
                                    <div id="drag-${idx}" data-word="${item.word}" draggable="true" ondragstart="drag(event)" class="cursor-move bg-white border border-slate-300 text-slate-700 font-semibold py-2 px-4 rounded-full shadow-sm hover:bg-sky-50 transition select-none">
                                        ${item.word}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        
                        <!-- Right: Scrollable hints container -->
                        <div class="w-full md:w-2/3 space-y-4 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
                            ${words.map((item, index) => {
                                const uniqueId = `u${unitNumber}-c${categoryName.replace(/\s/g, '')}-${index}`;
                                return `
                                    <div class="card bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                                        <div class="flex-1">
                                            <p class="text-slate-700">${item.hint}</p>
                                        </div>
                                        <div class="flex-shrink-0 w-36 h-12 border-2 border-dashed border-slate-300 bg-slate-50 rounded-lg flex items-center justify-center transition-colors" 
                                             ondrop="drop(event, '${item.word}', '${uniqueId}')" 
                                             ondragover="allowDrop(event)" 
                                             ondragleave="dragLeave(event)">
                                            <span class="text-slate-400 text-sm">Drop here</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                    
                    <div class="text-center mt-8">
                        <button onclick="displayVocabCategories(${unitNumber})" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2 px-6 rounded-lg transition">&larr; Back to Vocabulary Categories</button>
                    </div>
                `;
                showScreen('content-screen');
                return; // Exit here for D&D layout
            }

            // Standard layout for other vocabularies
            contentScreen.innerHTML = `
                <header class="text-center mb-8"><h1 class="text-2xl md:text-3xl font-bold text-slate-900">${categoryName}</h1><p class="text-slate-600 mt-2">Guess the word based on the hint.</p></header>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${words.map((item, index) => {
                        const uniqueId = `u${unitNumber}-c${categoryName.replace(/\s/g, '')}-${index}`;
                        
                        let hintHtml = '';
                        if (categoryName === "Holidays: Ways of Travelling") {
                            const vehicle = item.word.split(' ')[1];
                            hintHtml = `<p class="text-slate-600">${item.hint} <span class="font-bold text-slate-800">by ${vehicle.charAt(0)}...</span></p>`;
                        } else {
                            hintHtml = `<p class="text-slate-600">${item.hint} <span class="font-bold text-slate-800">${item.word.charAt(0)}...</span></p>`;
                        }

                        return `<div class="card bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                    <div class="mb-3 min-h-[40px]">${hintHtml}</div>
                                    <div class="flex gap-2">
                                        <input type="text" id="input-${uniqueId}" data-answer="${item.word.toLowerCase()}" class="w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition" placeholder="Type your guess...">
                                        <button onclick="checkVocabAnswer('${uniqueId}')" class="flex-shrink-0 bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2 px-4 rounded-md transition">Check</button>
                                    </div>
                                    <p id="result-${uniqueId}" class="result-text text-sm font-medium mt-2 h-5"></p>
                                </div>`;
                    }).join('')}
                </div>
                <div class="text-center mt-8"><button onclick="displayVocabCategories(${unitNumber})" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2 px-6 rounded-lg transition">&larr; Back to Vocabulary Categories</button></div>`;
            showScreen('content-screen');
            contentScreen.querySelectorAll('input[type="text"]').forEach(input => {
                input.addEventListener('keypress', e => e.key === 'Enter' && checkVocabAnswer(input.id.replace('input-', '')));
                input.addEventListener('input', () => {
                    const uniqueId = input.id.replace('input-', '');
                    document.getElementById(`result-${uniqueId}`).textContent = '';
                    input.classList.remove('input-correct', 'input-incorrect');
                });
            });
        }

        function displayGrammarTheory(unitNumber) {
            playSound(clickSound);
            const theory = grammarData[unitNumber].theory;
            contentScreen.innerHTML = `
                <header class="text-center mb-8"><h1 class="text-2xl md:text-3xl font-bold text-slate-900">Unit ${unitNumber} Grammar Theory</h1></header>
                <div class="bg-white p-6 rounded-lg shadow-sm border">${theory}</div>
                <div class="text-center mt-8"><button onclick="displayGrammarMenu(${unitNumber})" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2 px-6 rounded-lg transition">&larr; Back to Grammar Menu</button></div>`;
            showScreen('content-screen');
        }
        
        function displayGrammarActivity(unitNumber) {
            playSound(clickSound);
            const activity = grammarData[unitNumber].activity;
            contentScreen.innerHTML = `
                <header class="text-center mb-8"><h1 class="text-2xl md:text-3xl font-bold text-slate-900">Unit ${unitNumber} Grammar Activity</h1><p class="text-slate-600 mt-2">Choose the correct option for each question.</p></header>
                <div id="quiz-container" class="space-y-4">
                    ${activity.map((item, index) => `
                        <div id="q-container-${index}" class="bg-white p-4 rounded-lg shadow-sm border">
                            <p class="font-semibold mb-3">${index + 1}. ${item.q}</p>
                            <div class="flex flex-col sm:flex-row gap-2" data-answer="${item.a}">
                                ${item.o.map((opt, optIndex) => `<button onclick="selectAnswer(this, ${index})" class="quiz-option w-full text-left p-2 border border-slate-300 rounded-md hover:bg-sky-100 transition">${opt}</button>`).join('')}
                            </div>
                            <p id="res-${index}" class="text-sm font-bold mt-2"></p>
                        </div>
                    `).join('')}
                </div>
                <div id="quiz-footer" class="text-center mt-8">
                    <button onclick="checkGrammarAnswers(${unitNumber})" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg transition text-lg">Check My Answers</button>
                    <div class="mt-4"><button onclick="displayGrammarMenu(${unitNumber})" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2 px-6 rounded-lg transition">&larr; Back to Grammar Menu</button></div>
                </div>`;
            showScreen('content-screen');
        }
        
        function selectAnswer(btn, qIndex) {
            const parent = btn.parentElement;
            parent.querySelectorAll('.quiz-option').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function checkGrammarAnswers(unitNumber) {
            playSound(clickSound, "C5");
            const activity = grammarData[unitNumber].activity;
            let score = 0;
            activity.forEach((item, index) => {
                const container = document.getElementById(`q-container-${index}`);
                const options = container.querySelectorAll('.quiz-option');
                const resultEl = document.getElementById(`res-${index}`);
                const selectedBtn = container.querySelector('.quiz-option.selected');
                
                options.forEach(b => b.disabled = true);

                if (selectedBtn) {
                    const selectedAnswer = Array.from(options).indexOf(selectedBtn);
                    if (selectedAnswer === item.a) {
                        score++;
                        selectedBtn.classList.add('correct');
                        resultEl.textContent = 'Correct!';
                        resultEl.className = 'text-sm font-bold mt-2 result-correct';
                    } else {
                        selectedBtn.classList.add('incorrect');
                        options[item.a].classList.add('correct');
                        resultEl.textContent = 'Incorrect.';
                        resultEl.className = 'text-sm font-bold mt-2 result-incorrect';
                    }
                } else {
                    options[item.a].classList.add('correct');
                    resultEl.textContent = 'The correct answer is highlighted.';
                    resultEl.className = 'text-sm font-bold mt-2 text-amber-600';
                }
            });
            
            const footer = document.getElementById('quiz-footer');
            footer.innerHTML = `
                <div class="bg-white p-4 rounded-lg shadow-md text-2xl font-bold">Your score: ${score} / ${activity.length}</div>
                <div class="mt-4"><button onclick="displayGrammarMenu(${unitNumber})" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2 px-6 rounded-lg transition">&larr; Back to Grammar Menu</button></div>
            `;
        }

        function checkVocabAnswer(uniqueId) {
            const inputEl = document.getElementById(`input-${uniqueId}`);
            const resultEl = document.getElementById(`result-${uniqueId}`);
            const userAnswer = inputEl.value.trim().toLowerCase();
            const correctAnswer = inputEl.dataset.answer;
            if (!userAnswer) { resultEl.textContent = 'Please enter an answer.'; resultEl.className = 'result-text text-sm font-medium mt-2 h-5 text-amber-600'; return; }
            if (userAnswer === correctAnswer) {
                playSound(correctSound, "C5");
                resultEl.textContent = 'Correct! 🎉';
                resultEl.className = 'result-text text-sm font-medium mt-2 h-5 result-correct';
                inputEl.classList.add('input-correct');
            } else {
                playSound(incorrectSound, "C3");
                resultEl.innerHTML = `Not quite. The answer is <strong class="font-bold">${correctAnswer}</strong>.`;
                resultEl.className = 'result-text text-sm font-medium mt-2 h-5 result-incorrect';
                inputEl.classList.add('input-incorrect');
            }
        }

        window.openMysteryBox = function(uniqueId) {
            playSound(clickSound);
            const box = document.getElementById(`mystery-box-${uniqueId}`);
            box.style.opacity = '0';
            box.style.pointerEvents = 'none';
            
            const flipCard = document.getElementById(`flip-card-${uniqueId}`);
            flipCard.style.opacity = '1';
            flipCard.style.pointerEvents = 'auto';
        };

        window.checkAndFlip = function(uniqueId) {
            const inputEl = document.getElementById(`input-${uniqueId}`);
            const userAnswer = inputEl.value.trim().toLowerCase();
            const correctAnswer = inputEl.dataset.answer;
            const resultMsg = document.getElementById(`result-msg-${uniqueId}`);
            
            if (!userAnswer) {
                 inputEl.classList.add('border-red-500', 'bg-red-50');
                 setTimeout(() => inputEl.classList.remove('border-red-500', 'bg-red-50'), 800);
                 return;
            }

            if (userAnswer === correctAnswer) {
                playSound(correctSound, "C5");
                resultMsg.textContent = "Correct! 🎉";
                resultMsg.className = "text-lg font-bold mb-2 text-green-600";
            } else {
                playSound(incorrectSound, "C3");
                resultMsg.textContent = "Not quite!";
                resultMsg.className = "text-lg font-bold mb-2 text-red-600";
            }

            // Trigger the 3D CSS flip
            document.getElementById(`flip-card-${uniqueId}`).classList.add('rotate-y-180');
        };

    </script>
</body>
</html>
